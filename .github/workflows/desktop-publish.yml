name: desktop-publish

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build frontend bundle
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Run desktop tests
        working-directory: desktop
        run: npm test

      - name: Install Wine for Windows packaging
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine64
          wine --version

      - name: Build desktop release artifacts
        working-directory: desktop
        run: ${{ matrix.os == 'ubuntu-latest' && 'npm run dist:local' || 'npm run dist' }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/release/**
          if-no-files-found: error
