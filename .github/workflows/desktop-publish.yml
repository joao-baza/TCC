name: desktop-publish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Windows frontend native dependencies
        if: matrix.os == 'windows-latest'
        working-directory: frontend
        run: |
          $version = node -p "require('./node_modules/lightningcss/package.json').version"
          npm install --no-save "lightningcss-win32-x64-msvc@$version"

      - name: Build frontend bundle
        working-directory: frontend
        run: npm run build:local

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Run desktop tests
        working-directory: desktop
        run: npm test

      - name: Build desktop release artifacts
        working-directory: desktop
        run: ${{ matrix.os == 'ubuntu-latest' && 'npm run dist:linux' || matrix.os == 'windows-latest' && 'npm run dist:windows' || 'npm run dist' }}

      - name: Smoke packaged release artifact
        working-directory: desktop
        run: ${{ matrix.os == 'ubuntu-latest' && 'npm run smoke:linux' || matrix.os == 'windows-latest' && 'npm run smoke:windows' || 'npm run smoke:macos' }}

      - name: Generate release checksums
        working-directory: desktop
        run: npm run checksums

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.exe.sha256
            desktop/release/*.dmg
            desktop/release/*.dmg.sha256
            desktop/release/*.AppImage
            desktop/release/*.AppImage.sha256
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs: build-desktop
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          path: desktop-release
          pattern: desktop-*
          merge-multiple: true

      - name: Compute desktop release metadata
        id: release_meta
        run: |
          human_timestamp=$(TZ=Etc/GMT+3 date '+%d/%m/%Y %H:%M:%Sh')
          tag_timestamp=$(TZ=Etc/GMT+3 date '+%Y-%m-%d-%H-%M-%S')
          {
            echo "release_name=Aplicação desktop - ${human_timestamp}"
            echo "tag_name=desktop-${tag_timestamp}-gmt-3"
          } >> "$GITHUB_OUTPUT"

      - name: Publish desktop release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_meta.outputs.release_name }}
          files: |
            desktop-release/*.exe
            desktop-release/*.exe.sha256
            desktop-release/*.dmg
            desktop-release/*.dmg.sha256
            desktop-release/*.AppImage
            desktop-release/*.AppImage.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
