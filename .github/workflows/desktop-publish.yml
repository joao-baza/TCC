name: desktop-publish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build frontend bundle
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Run desktop tests
        working-directory: desktop
        run: npm test

      - name: Install Wine for Windows packaging
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine32:i386
          wine --version

      - name: Build desktop release artifacts
        working-directory: desktop
        run: ${{ matrix.os == 'ubuntu-latest' && 'npm run dist:local' || 'npm run dist' }}

      - name: Generate release checksums
        working-directory: desktop/release
        run: |
          find . -type f ! -name '*.sha256' -print0 | while IFS= read -r -d '' file; do
            shasum -a 256 "$file" > "$file.sha256"
          done

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/release/**
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs: build-desktop
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          path: desktop-release
          pattern: desktop-*
          merge-multiple: true

      - name: Publish desktop release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-${{ github.run_id }}
          target_commitish: ${{ github.sha }}
          name: Desktop build ${{ github.run_number }}
          files: desktop-release/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
