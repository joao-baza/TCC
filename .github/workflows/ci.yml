name: ci

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dcou_test
          POSTGRES_USER: dcou
          POSTGRES_PASSWORD: dcou_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dcou -d dcou_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      PID_TEST_DATABASE_URL: postgresql+psycopg://dcou:dcou_test@127.0.0.1:5432/dcou_test
      PID_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Validate P&ID catalog manifests
        run: >-
          python -m pid.catalog.validator
          pid/catalog/manifests/free/foundation.json

  frontend-test:
    runs-on: ubuntu-latest
    needs: backend-test
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - name: Run isolated P&ID performance benchmark
        run: npm run benchmark:pid
        timeout-minutes: 2
      - run: npm run build:local

  frontend-e2e:
    runs-on: ubuntu-latest
    needs: frontend-test
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build:local
      - run: npx playwright install --with-deps chromium
      - name: Run frontend E2E tests
        run: npm run test:e2e -- --project=chromium
        env:
          VITE_PID_ADAPTER: local

  desktop-smoke:
    runs-on: ubuntu-latest
    needs:
      - frontend-e2e
      - publish-frontend
      - publish-api
    if: >-
      always() &&
      needs.frontend-e2e.result == 'success' &&
      (needs.publish-frontend.result == 'success' || needs.publish-frontend.result == 'skipped') &&
      (needs.publish-api.result == 'success' || needs.publish-api.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build frontend bundle
        working-directory: frontend
        run: npm ci && npm run build:local

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Run desktop unit and smoke tests
        working-directory: desktop
        run: npm test

      - name: Build packaged backend
        working-directory: desktop
        run: npm run build:backend

      - name: Verify unpacked desktop package
        working-directory: desktop
        run: npx electron-builder --config electron-builder.yml --dir

  publish-frontend:
    runs-on: ubuntu-latest
    needs: frontend-e2e
    permissions:
      contents: read
      packages: write
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/tcc-frontend
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.frontend
          build-args: |
            VITE_PID_ADAPTER=disabled
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-api:
    runs-on: ubuntu-latest
    needs: publish-frontend
    permissions:
      contents: read
      packages: write
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/tcc-api
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-desktop-macos:
    runs-on: macos-latest
    needs: desktop-smoke
    permissions:
      contents: write
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build frontend bundle
        working-directory: frontend
        run: npm ci && npm run build:local

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Run desktop tests
        working-directory: desktop
        run: npm test

      - name: Build desktop release artifacts
        working-directory: desktop
        run: npm run dist

      - name: Smoke packaged release artifact
        working-directory: desktop
        run: npm run smoke:macos

      - name: Generate release checksums
        working-directory: desktop
        run: npm run checksums

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-latest
          path: |
            desktop/release/*.exe
            desktop/release/*.exe.sha256
            desktop/release/*.dmg
            desktop/release/*.dmg.sha256
            desktop/release/*.AppImage
            desktop/release/*.AppImage.sha256
          if-no-files-found: error

  build-desktop-windows:
    runs-on: windows-latest
    needs: build-desktop-macos
    permissions:
      contents: write
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Windows frontend native dependencies
        working-directory: frontend
        run: |
          $version = node -p "require('./node_modules/lightningcss/package.json').version"
          npm install --no-save "lightningcss-win32-x64-msvc@$version"

      - name: Build frontend bundle
        working-directory: frontend
        run: npm run build:local

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Run desktop tests
        working-directory: desktop
        run: npm test

      - name: Build desktop release artifacts
        working-directory: desktop
        run: npm run dist:windows

      - name: Smoke packaged release artifact
        working-directory: desktop
        run: npm run smoke:windows

      - name: Generate release checksums
        working-directory: desktop
        run: npm run checksums

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-latest
          path: |
            desktop/release/*.exe
            desktop/release/*.exe.sha256
            desktop/release/*.dmg
            desktop/release/*.dmg.sha256
            desktop/release/*.AppImage
            desktop/release/*.AppImage.sha256
          if-no-files-found: error

  build-desktop-ubuntu:
    runs-on: ubuntu-latest
    needs: build-desktop-windows
    permissions:
      contents: write
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build frontend bundle
        working-directory: frontend
        run: npm ci && npm run build:local

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Run desktop tests
        working-directory: desktop
        run: npm test

      - name: Build desktop release artifacts
        working-directory: desktop
        run: npm run dist:linux

      - name: Smoke packaged release artifacts
        working-directory: desktop
        run: npm run smoke:linux

      - name: Generate release checksums
        working-directory: desktop
        run: npm run checksums

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-ubuntu-latest
          path: |
            desktop/release/*.exe
            desktop/release/*.exe.sha256
            desktop/release/*.dmg
            desktop/release/*.dmg.sha256
            desktop/release/*.AppImage
            desktop/release/*.AppImage.sha256
          if-no-files-found: error

  publish-desktop-release:
    runs-on: ubuntu-latest
    needs: build-desktop-ubuntu
    permissions:
      actions: read
      contents: write
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          path: desktop-release
          pattern: desktop-*
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('desktop-{0}', github.run_id) }}
          target_commitish: ${{ github.sha }}
          files: |
            desktop-release/*.exe
            desktop-release/*.exe.sha256
            desktop-release/*.dmg
            desktop-release/*.dmg.sha256
            desktop-release/*.AppImage
            desktop-release/*.AppImage.sha256
