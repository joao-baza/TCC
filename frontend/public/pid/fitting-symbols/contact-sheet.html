<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Revisao dos SVGs de fittings</title>
  <style>
    :root { color-scheme: light; font-family: ui-sans-serif, system-ui, sans-serif; color: #0f172a; background: #f8fafc; }
    body { margin: 0; padding: 32px; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0 0 24px; color: #475569; }
    .reference, .grid { display: grid; gap: 16px; }
    .reference { grid-template-columns: minmax(220px, 360px); margin-bottom: 28px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
    figure { margin: 0; min-height: 132px; border: 1px solid #cbd5e1; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; }
    img { max-width: 150px; max-height: 82px; object-fit: contain; }
    figcaption { font-size: 12px; font-weight: 650; text-align: center; line-height: 1.3; }
  </style>
</head>
<body>
  <h1>SVGs de fittings de tubulacao</h1>
  <p>Contact sheet de revisao. Estes assets ainda nao estao conectados ao catalogo P&amp;ID.</p>
  <section class="reference" aria-label="Referencia visual">
    <figure>
      <img src="piping.svg" alt="Tubulacao modular" />
      <figcaption>Referencia: piping.svg</figcaption>
    </figure>
  </section>
  <section class="grid" aria-label="Fittings">
      <figure>
        <img src="retorno-180.svg" alt="Retorno 180°" />
        <figcaption>Retorno 180°</figcaption>
      </figure>
      <figure>
        <img src="cotovelo-90-raio-longo.svg" alt="Cotovelo 90° raio longo" />
        <figcaption>Cotovelo 90° raio longo</figcaption>
      </figure>
      <figure>
        <img src="cotovelo-90-raio-curto.svg" alt="Cotovelo 90° raio curto" />
        <figcaption>Cotovelo 90° raio curto</figcaption>
      </figure>
      <figure>
        <img src="te-passagem-reta.svg" alt="Tê (passagem reta)" />
        <figcaption>Tê (passagem reta)</figcaption>
      </figure>
      <figure>
        <img src="saida-de-tanque.svg" alt="Saída de tanque" />
        <figcaption>Saída de tanque</figcaption>
      </figure>
      <figure>
        <img src="valvula-diafragma.svg" alt="Válvula diafragma" />
        <figcaption>Válvula diafragma</figcaption>
      </figure>
      <figure>
        <img src="valvula-esfera.svg" alt="Válvula esfera" />
        <figcaption>Válvula esfera</figcaption>
      </figure>
      <figure>
        <img src="valvula-gaveta.svg" alt="Válvula gaveta" />
        <figcaption>Válvula gaveta</figcaption>
      </figure>
      <figure>
        <img src="valvula-retencao-de-pe.svg" alt="Válvula retenção de pé" />
        <figcaption>Válvula retenção de pé</figcaption>
      </figure>
      <figure>
        <img src="valvula-agulha.svg" alt="Válvula agulha" />
        <figcaption>Válvula agulha</figcaption>
      </figure>
      <figure>
        <img src="valvula-globo-aberta.svg" alt="Válvula globo (aberta)" />
        <figcaption>Válvula globo (aberta)</figcaption>
      </figure>
      <figure>
        <img src="valvula-borboleta.svg" alt="Válvula borboleta" />
        <figcaption>Válvula borboleta</figcaption>
      </figure>
      <figure>
        <img src="cotovelo-90-raio-medio.svg" alt="Cotovelo 90° raio médio" />
        <figcaption>Cotovelo 90° raio médio</figcaption>
      </figure>
      <figure>
        <img src="entrada-normal.svg" alt="Entrada normal" />
        <figcaption>Entrada normal</figcaption>
      </figure>
      <figure>
        <img src="valvula-retencao-leve.svg" alt="Válvula retenção, leve" />
        <figcaption>Válvula retenção, leve</figcaption>
      </figure>
  </section>
</body>
</html>
