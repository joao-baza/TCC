server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        image/svg+xml font/woff2;

    # Assets estáticos com hash/versão raramente mudam: cache longo
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Proxy da API no mesmo host — evita CORS entre frontend e API
    # Com variável em proxy_pass o nginx não remove o prefixo /api/ sozinho; rewrite explícito.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream tcc_tcc-api;
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://$api_upstream:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HTML nunca em cache agressivo (entrega sempre a versão mais nova)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
