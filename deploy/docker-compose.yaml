services:
  tcc-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - tcc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - SJNet
    deploy:
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.hostname == ${POSTGRES_NODE_HOSTNAME}

  tcc-redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-128mb}
      - --maxmemory-policy
      - volatile-ttl
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - SJNet
    deploy:
      restart_policy:
        condition: on-failure

  tcc-api:
    image: tcc-api:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      DCOU_ROOT_PATH: /api
      PID_ENABLED: ${PID_ENABLED:-false}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PID_TOKEN_PEPPER: ${PID_TOKEN_PEPPER}
      PID_ALLOWED_ORIGINS: ${PID_ALLOWED_ORIGINS}
      PID_WS_PUBLIC_URL: ${PID_WS_PUBLIC_URL}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/ready', timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - SJNet
    deploy:
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=SJNet"
        - "traefik.http.routers.tcc-api.rule=Host(`tcc.api.joao.baza.dev.br`)"
        - "traefik.http.routers.tcc-api.entrypoints=websecure"
        - "traefik.http.routers.tcc-api.tls=true"
        - "traefik.http.routers.tcc-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.tcc-api-main.rule=Host(`tcc.joao.baza.dev.br`) && PathPrefix(`/api`)"
        - "traefik.http.routers.tcc-api-main.entrypoints=websecure"
        - "traefik.http.routers.tcc-api-main.tls=true"
        - "traefik.http.routers.tcc-api-main.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.tcc-api-main.middlewares=tcc-api-strip"
        - "traefik.http.middlewares.tcc-api-strip.stripprefix.prefixes=/api"
        - "traefik.http.services.tcc-api.loadbalancer.server.port=5000"

  tcc-frontend:
    image: tcc-frontend:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_PID_ADAPTER: disabled
    networks:
      - SJNet
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=SJNet"
        - "traefik.http.routers.tcc-frontend.rule=Host(`tcc.joao.baza.dev.br`)"
        - "traefik.http.routers.tcc-frontend.entrypoints=websecure"
        - "traefik.http.routers.tcc-frontend.tls=true"
        - "traefik.http.routers.tcc-frontend.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.tcc-frontend.loadbalancer.server.port=80"

volumes:
  tcc_postgres_data:

networks:
  SJNet:
    external: true
